spring.application.name=calendario
spring.mongodb.uri=mongodb://root:password@localhost:27017/calendario?authSource=admin

#JWT Configuration
jwt.secret=${JWT_SECRET:dev-super-secret-key-32-chars-minimum-1234}
jwt.expiration=${JWT_EXPIRATION:3600000}

#Calendar Invite Configuration
app.calendar.invite.base-url=${CALENDAR_INVITE_BASE_URL:https://app.example.com/invite/calendars}
<div class="page-container">

  <div class="title-box">
    <h1>CalendarIO</h1>
  </div>

  <div class="create-account-box">
    <p class="welcome-text">Join CalendarIO and start managing your schedule today.</p>

    <h2>Create Account</h2>

    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter username">
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter email">
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password (5-25 characters)">
    </div>

    <div class="button-group">
      <button class="btn-create-account">Create Account</button>
      
      <button class="btn-login">Already a User? Log in here</button>
    </div>
  </div>

</div>

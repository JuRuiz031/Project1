<div class="modal-overlay" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="modal-header">
      <div class="header-left">
        <h2 class="modal-title">View Event</h2>
        <button class="btn-share" (click)="onShare()" title="Share this event">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="18" cy="5" r="3"/>
            <circle cx="6" cy="12" r="3"/>
            <circle cx="18" cy="19" r="3"/>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
          </svg>
          Share
        </button>
      </div>
      <button class="modal-close-btn" (click)="onClose()" aria-label="Close modal">
        ✕
      </button>
    </div>

    <!-- Success Notification Toast -->
    @if (showNotification()) {
      <div class="success-notification">
        <span class="notification-icon">✓</span>
        Event updated successfully!
      </div>
    }

    <!-- Body -->
    <div class="modal-body">
      @if (apiError(); as err) {
        <div class="alert alert-danger mb-3">
          {{ err }}
        </div>
      }

      @if (event(); as e) {
        <div>
          <!-- Calendar dropdown -->
          <div class="mb-3">
            <label class="form-label">Calendar</label>
            <select class="form-select app-select" disabled>
              <option value="" disabled>Select calendar</option>
              @for (c of adminCalendars(); track c.id) {
                <option [value]="c.id" [selected]="c.id === e.calendarId">
                  {{ c.name }}
                </option>
              }
            </select>
          </div>

          <!-- Title -->
          <div class="mb-3">
            <label class="form-label">Event Title</label>
            <input
              type="text"
              class="form-control app-input"
              [value]="e.title"
              disabled
            />
          </div>

          <!-- Dates / times -->
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label class="form-label">Start date</label>
              <input
                type="date"
                class="form-control app-input"
                [value]="e.startDate"
                disabled
              />
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label">Start time</label>
              <input
                type="time"
                class="form-control app-input"
                [value]="e.startTime"
                disabled
              />
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label">End date</label>
              <input
                type="date"
                class="form-control app-input"
                [value]="e.endDate"
                disabled
              />
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label">End time</label>
              <input
                type="time"
                class="form-control app-input"
                [value]="e.endTime"
                disabled
              />
            </div>
          </div>

          <!-- Description -->
          <div class="mt-3 mb-3">
            <label class="form-label">Description</label>
            <textarea
              rows="4"
              class="form-control app-textarea"
              disabled
            >{{ e.description }}</textarea>
          </div>

          <!-- Notes -->
          <div class="mb-2">
            <label class="form-label">Notes</label>
            <textarea
              rows="4"
              class="form-control app-textarea"
              disabled
            >{{ e.notes }}</textarea>
          </div>

          <!-- Tags -->
          @if (e.tags && e.tags.length > 0) {
            <div class="mb-3">
              <label class="form-label">Tags</label>
              <div class="tags-display">
                @for (tag of e.tags; track tag) {
                  <span class="tag-chip">{{ tag }}</span>
                }
              </div>
            </div>
          }
        </div>
      }
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button class="btn btn-outline-secondary" (click)="onBack()">
        ← Back to Events
      </button>

      @if (canEdit()) {
        <button class="btn btn-primary" (click)="onEditEvent()">
          Edit Event
        </button>
      } @else {
        <button class="btn btn-primary" disabled title="You don't have permission to edit this event">
          Edit Event
        </button>
      }
    </div>
  </div>
</div>

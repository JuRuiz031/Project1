<div class="modal-overlay" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="modal-header">
      <h2 class="modal-title">View Event</h2>
      <button class="modal-close-btn" (click)="onClose()" aria-label="Close modal">
        ✕
      </button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      @if (apiError(); as err) {
        <div class="alert alert-danger mb-3">
          {{ err }}
        </div>
      }

      @if (event(); as e) {
        <div>
          <!-- Calendar dropdown -->
          <div class="mb-3">
            <label class="form-label">Calendar</label>
            <select class="form-select app-select" disabled>
              <option value="" disabled>Select calendar</option>
              @for (c of adminCalendars(); track c.id) {
                <option [value]="c.id" [selected]="c.id === e.calendarId">
                  {{ c.name }}
                </option>
              }
            </select>
          </div>

          <!-- Title -->
          <div class="mb-3">
            <label class="form-label">Event Title</label>
            <input
              type="text"
              class="form-control app-input"
              [value]="e.title"
              disabled
            />
          </div>

          <!-- Dates / times -->
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label class="form-label">Start date</label>
              <input
                type="date"
                class="form-control app-input"
                [value]="e.startDate"
                disabled
              />
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label">Start time</label>
              <input
                type="time"
                class="form-control app-input"
                [value]="e.startTime"
                disabled
              />
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label">End date</label>
              <input
                type="date"
                class="form-control app-input"
                [value]="e.endDate"
                disabled
              />
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label">End time</label>
              <input
                type="time"
                class="form-control app-input"
                [value]="e.endTime"
                disabled
              />
            </div>
          </div>

          <!-- Description -->
          <div class="mt-3 mb-3">
            <label class="form-label">Description</label>
            <textarea
              rows="4"
              class="form-control app-textarea"
              disabled
            >{{ e.description }}</textarea>
          </div>

          <!-- Notes -->
          <div class="mb-2">
            <label class="form-label">Notes</label>
            <textarea
              rows="4"
              class="form-control app-textarea"
              disabled
            >{{ e.notes }}</textarea>
          </div>
        </div>
      }
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button class="btn btn-outline-secondary" (click)="onBack()">
        ← Back to Events
      </button>

      @if (canEdit()) {
        <button class="btn btn-primary" (click)="onEditEvent()">
          Edit Event
        </button>
      } @else {
        <button class="btn btn-primary" disabled title="You don't have permission to edit this event">
          Edit Event
        </button>
      }
    </div>
  </div>
</div>

<div class="container py-4 app-page">
  <h1 class="h3 mb-3">View Event</h1>

  <div class="card app-card shadow-sm">
    <div class="card-body">
      <form [formGroup]="form" novalidate>
        <!-- Calendar dropdown -->
        <div class="mb-3">
          <label class="form-label">Calendar</label>
          <select class="form-select app-select" formControlName="calendarId">
            <option value="" disabled>Select calendar</option>
            <option *ngFor="let c of adminCalendars" [value]="c.id">
              {{ c.name }}
            </option>
          </select>
        </div>

        <!-- Title -->
        <div class="mb-3">
          <label class="form-label">Event Title</label>
          <input
            type="text"
            class="form-control app-input"
            placeholder=""
            formControlName="title"
          />
        </div>

        <!-- Dates / times -->
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label class="form-label">Start date</label>
            <input
              type="date"
              class="form-control app-input"
              formControlName="startDate"
            />
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">Start time</label>
            <input
              type="time"
              class="form-control app-input"
              formControlName="startTime"
            />
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">End date</label>
            <input
              type="date"
              class="form-control app-input"
              formControlName="endDate"
            />
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">End time</label>
            <input
              type="time"
              class="form-control app-input"
              formControlName="endTime"
            />
          </div>
        </div>

        <!-- Description -->
        <div class="mt-3 mb-3">
          <label class="form-label">Description</label>
          <textarea
            rows="4"
            class="form-control app-textarea"
            placeholder=""
            formControlName="description"
          ></textarea>
        </div>

        <!-- Notes -->
        <div class="mb-2">
          <label class="form-label">Notes</label>
          <textarea
            rows="4"
            class="form-control app-textarea"
            placeholder=""
            formControlName="notes"
          ></textarea>
        </div>

        <!-- API error (optional) -->
        <div *ngIf="apiError" class="alert alert-danger mt-3 mb-0">
          {{ apiError }}
        </div>
      </form>
    </div>

    <div class="card-footer d-flex justify-content-end gap-2">
      <!-- Back -->
      <a class="btn btn-outline-light" routerLink="/main-page">Back</a>

      <!-- Edit -->
      <a class="btn btn-primary" routerLink="/edit-event">Edit Event</a>
    </div>
  </div>
</div>

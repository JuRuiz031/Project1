<div class="container py-4 app-page">
  <h1 class="h3 mb-3">Create Event</h1>

  <div class="card app-card shadow-sm">
    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <!-- Calendar dropdown -->
        <div class="mb-3">
          <label class="form-label">Calendar (admin only)</label>
          <select
            class="form-select app-select"
            formControlName="calendarId"
            [ngClass]="{ 'is-invalid': hasError('calendarId') }"
          >
            <option value="" disabled>Select calendar (admin only)</option>
            <option *ngFor="let c of adminCalendars" [value]="c.id">
              {{ c.name }}
            </option>
          </select>
          <div class="invalid-feedback">Please select an admin calendar.</div>
        </div>

        <!-- Title -->
        <div class="mb-3">
          <label class="form-label">Event Title</label>
          <input
            type="text"
            class="form-control app-input"
            placeholder="Event Title"
            formControlName="title"
            [ngClass]="{ 'is-invalid': hasError('title') }"
          />
          <div class="invalid-feedback">Title is required (min 2 chars).</div>
        </div>

        <!-- Dates / times -->
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label class="form-label">Start date</label>
            <input
              type="date"
              class="form-control app-input"
              formControlName="startDate"
              [ngClass]="{ 'is-invalid': hasError('startDate') }"
            />
            <div class="invalid-feedback">Start date required.</div>
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">Start time</label>
            <input
              type="time"
              class="form-control app-input"
              formControlName="startTime"
              [ngClass]="{ 'is-invalid': hasError('startTime') }"
            />
            <div class="invalid-feedback">Start time required.</div>
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">End date</label>
            <input
              type="date"
              class="form-control app-input"
              formControlName="endDate"
              [ngClass]="{ 'is-invalid': hasError('endDate') }"
            />
            <div class="invalid-feedback">End date required.</div>
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">End time</label>
            <input
              type="time"
              class="form-control app-input"
              formControlName="endTime"
              [ngClass]="{ 'is-invalid': hasError('endTime') }"
            />
            <div class="invalid-feedback">End time required.</div>
          </div>
        </div>

        <!-- Description -->
        <div class="mt-3 mb-3">
          <label class="form-label">Description</label>
          <textarea
            rows="4"
            class="form-control app-textarea"
            placeholder="Description"
            formControlName="description"
          ></textarea>
        </div>

        <!-- Notes -->
        <div class="mb-2">
          <label class="form-label">Notes</label>
          <textarea
            rows="4"
            class="form-control app-textarea"
            placeholder="Notes"
            formControlName="notes"
          ></textarea>
        </div>

        <!-- API error -->
        <div *ngIf="apiError" class="alert alert-danger mt-3 mb-0">
          {{ apiError }}
        </div>
      </form>
    </div>

    <div class="card-footer d-flex justify-content-end gap-2">
      <!-- Cancel -->
      <button
        type="button"
        class="btn btn-outline-secondary"
        (click)="cancel()"
        [disabled]="isSubmitting"
      >
        Cancel
      </button>

      <!-- Submit -->
      <button
        type="button"
        class="btn btn-primary"
        (click)="submit()"
        [disabled]="isSubmitting"
      >
        {{ isSubmitting ? 'Creating...' : 'Create Event' }}
      </button>
    </div>
  </div>
</div>

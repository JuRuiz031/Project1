<div class="container py-4 app-page">
  <h1 class="h3 mb-3">Profile</h1>

  <!-- Success Notification Toast -->
  @if (showNotification()) {
    <div class="success-notification">
      <span class="notification-icon">✓</span>
      Profile updated successfully!
    </div>
  }

  <div class="card app-card shadow-sm">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label">Username</label>
          <input class="form-control app-input" [value]="user().name" disabled />
        </div>

        <div class="col-12">
          <label class="form-label">Email</label>
          <input class="form-control app-input" [value]="user().email" disabled />
        </div>
      </div>

      @if (apiError()) {
        <div class="alert alert-danger mt-3 mb-0">
          {{ apiError() }}
        </div>
      }
    </div>

    <div
      class="card-footer d-flex flex-wrap justify-content-between align-items-center gap-2"
    >
      <!-- Left-side action -->
      <button
        class="btn btn-outline-danger"
        type="button"
        (click)="logOut()"
      >
        Log Out
      </button>

      <!-- Right-side actions -->
      <div class="d-flex gap-2 ms-auto">
        <button
          class="btn btn-outline-secondary"
          type="button"
          (click)="goToDashboard()"
        >
          Back
        </button>

        <button
          class="btn btn-primary"
          type="button"
          (click)="goToEditUser()"
        >
          Edit Profile
        </button>
      </div>
    </div>


  </div>
</div>

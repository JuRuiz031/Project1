<app-base-modal
  [title]="'Create Calendar'"
  [headerStyle]="'gradient'"
  (close)="onClose()"
>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (apiError()) {
      <div class="alert alert-danger mb-3">
        <strong>{{ apiError() }}</strong>
      </div>
    }

    <div class="mb-3">
      <label class="form-label" for="calendar-name">Calendar name:</label>

      <input
        id="calendar-name"
        type="text"
        class="form-control app-input"
        formControlName="name"
        placeholder="Calendar name"
        autocomplete="off"
        [class.is-invalid]="hasError('name')"
      />

      <div class="invalid-feedback">
        Calendar name is required (1–50 characters).
      </div>

      <div class="form-text">
        Choose a short, recognizable name (1–50 characters).
      </div>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-4">
      <button
        type="button"
        class="btn btn-outline-secondary"
        (click)="onClose()"
        [disabled]="isSubmitting()"
      >
        Cancel
      </button>

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="form.invalid || isSubmitting()"
      >
        {{ isSubmitting() ? 'Creating...' : 'Create Calendar' }}
      </button>
    </div>
  </form>
</app-base-modal>

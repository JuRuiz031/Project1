<div class="container py-4 app-page">
  <h1 class="h3 mb-3">Create Calendar</h1>

  <div class="card app-card shadow-sm">
    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="createCalendar()" novalidate>
        <div class="mb-3">
          <label class="form-label" for="calendar-name">Calendar name:</label>

          <input
            id="calendar-name"
            type="text"
            class="form-control app-input"
            formControlName="name"
            placeholder="Calendar name"
            autocomplete="off"
            [class.is-invalid]="hasError('name')"
          />

          <div class="invalid-feedback">
            Calendar name is required (1–50 characters).
          </div>

          <div class="form-text">
            Choose a short, recognizable name (1–50 characters).
          </div>
        </div>

        @if (apiError()) {
          <div class="alert alert-danger mt-3 mb-0">
            <strong>{{ apiError() }}</strong>
          </div>
        }

        <!-- buttons should be inside the form so submit actually fires -->
        <div class="d-flex justify-content-end gap-2 mt-3">
          <button
            type="button"
            class="btn btn-outline-light"
            (click)="cancel()"
            [disabled]="isSubmitting()"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="form.invalid || isSubmitting()"
          >
            {{ isSubmitting() ? 'Creating...' : 'Submit' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

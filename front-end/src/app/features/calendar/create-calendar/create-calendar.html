<h2>Create Calendar</h2>

<form [formGroup]="form" (ngSubmit)="sendData()">
    <label for="calendar-name">Calendar name:</label>
    <input
    id="calendar-name"
    type="text"
    formControlName="name"
    required
    minlength="1"
    maxlength="50"
    />

    <button type="submit" [disabled]="!form.valid">Submit</button>
</form>

@if (response) {
  <p>
    Backend response: {{ response }}
  </p>
}

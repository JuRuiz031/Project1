<div class="container py-4 app-page">
  <h1 class="h3 mb-3">Edit Calendar Group</h1>

  <div class="card app-card shadow-sm">
    <div class="card-body">
      <!-- Name field -->
      <div class="mb-3">
        <label class="form-label">Calendar Group Name</label>
        <input
          class="form-control app-input"
          type="text"
          placeholder="Calendar group name"
          [value]="groupName"
          (input)="groupName = ($any($event.target).value)"
        />
      </div>

      <!-- Link field -->
      <div class="mb-3">
        <label class="form-label">Invite Link</label>
        <input
          class="form-control app-input"
          type="text"
          placeholder="Invite link"
          [value]="inviteLink"
          readonly
        />
      </div>

      <!-- Generate link button -->
      <button
        type="button"
        class="btn btn-outline-secondary w-100 mb-3"
        (click)="generateLink()"
      >
        Generate Link
      </button>

      <!-- Users list -->
      <div class="mb-3">
        <div class="fw-semibold mb-2">List of users on calendar</div>

        <ng-container *ngIf="users.length > 0; else noUsers">
          <div class="list-group">
            <button
              type="button"
              class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
              *ngFor="let u of users"
              [class.active]="u.id === selectedUserId"
              (click)="selectUser(u.id)"
            >
              <div>
                <div class="fw-bold">{{ u.username }}</div>
                <div class="small opacity-75">{{ u.email }}</div>
              </div>

              <span
                class="badge rounded-pill"
                [ngClass]="u.isAdmin ? 'text-bg-success' : 'text-bg-secondary'"
              >
                {{ u.isAdmin ? 'Admin' : 'Member' }}
              </span>
            </button>
          </div>
        </ng-container>

        <ng-template #noUsers>
          <div class="border rounded p-3 bg-light">
            No users yet.
          </div>
        </ng-template>
      </div>

      <!-- Action buttons under list -->
      <div class="row g-2">
        <div class="col-12 col-md-4">
          <button
            class="btn btn-outline-secondary w-100"
            type="button"
            (click)="promoteSelectedToAdmin()"
            [disabled]="!selectedUserId || selectedUserIsAdmin"
          >
            Promote to Admin
          </button>
        </div>

        <div class="col-12 col-md-4" *ngIf="!selectedUserIsAdmin">
          <button
            class="btn btn-outline-danger w-100"
            type="button"
            (click)="removeSelectedUser()"
            [disabled]="!selectedUserId"
          >
            Remove User
          </button>
        </div>
      </div>

      <!-- Error display -->
      <div *ngIf="apiError" class="alert alert-danger mt-3 mb-0" aria-live="polite">
        {{ apiError }}
      </div>
    </div>

    <!-- Footer actions -->
    <div class="card-footer d-flex flex-wrap justify-content-between align-items-center gap-2">
      <!-- Delete calendar group -->
      <button
        type="button"
        class="btn btn-outline-danger"
        (click)="openDeleteConfirm()"
      >
        Delete Calendar Group
      </button>

      <!-- Right-side actions -->
      <div class="d-flex gap-2 ms-auto">
        <button
          type="button"
          class="btn btn-outline-secondary"
          (click)="cancel()"
        >
          Cancel
        </button>

        <!-- Save Changes -> dashboard/main-page -->
        <button
          type="button"
          class="btn btn-primary"
          (click)="saveChanges()"
        >
          Save Changes
        </button>
      </div>
    </div>
  </div>

</div>

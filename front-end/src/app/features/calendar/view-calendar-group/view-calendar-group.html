<div class="container py-4 app-page">
  <h1 class="h3 mb-3">View Calendar Group</h1>

  <div class="card app-card shadow-sm">
    <div class="card-body">
      <!-- Calendar name -->
      <div class="mb-3 text-center fw-bold">
        {{ groupName }}
      </div>

      <!-- Invite link display -->
      <div class="mb-3 text-center">
        {{ inviteLink || '—' }}
      </div>

      <!-- Generate link -->
      <button
        type="button"
        class="btn btn-primary w-100 mb-3"
        (click)="generateLink()"
      >
        Generate Link
      </button>

      <!-- API error -->
      <div *ngIf="apiError" class="alert alert-danger mt-2 mb-0" aria-live="polite">
        {{ apiError }}
      </div>
    </div>

    <!-- Footer actions (matches Create Event / Create Calendar spacing) -->
    <div class="card-footer d-flex justify-content-end gap-2">
      <button
        type="button"
        class="btn btn-outline-light"
        (click)="cancel()"
      >
        Cancel
      </button>

      <button
        type="button"
        class="btn btn-primary"
        routerLink="/edit-calendar-group"
      >
        Edit Calendar
      </button>
    </div>
  </div>
</div>

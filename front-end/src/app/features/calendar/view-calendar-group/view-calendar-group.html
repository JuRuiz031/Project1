<section class="page" aria-label="View Calendar Group Page">
  <!-- NEW: page frame -->
  <section class="card page-frame" aria-label="View Calendar Frame">
    <div class="view-calendar">
      <section class="card view-calendar__outer" aria-label="View Calendar Group">
        <header class="view-calendar__header">
          <h1 class="view-calendar__title">View Calendar Group</h1>
        </header>

        <!-- Name field -->
        <div class="card view-calendar__name-box">
          <span class="view-calendar__name-text">
            {{ groupName }}
          </span>
        </div>

        <!-- Inner panel -->
        <section class="card view-calendar__panel">
          <div class="card view-calendar__field">
            <span class="view-calendar__field-text">
              {{ inviteLink || '—' }}
            </span>
          </div>

          <button
            class="view-calendar__btn view-calendar__btn--full"
            type="button"
            (click)="generateLink()"
          >
            Generate Link
          </button>

          <div class="view-calendar__spacer"></div>

          <div class="view-calendar__footer">
            <button
              class="view-calendar__btn view-calendar__btn--primary"
              type="button"
              routerLink="/edit-calendar-group"
            >
              Edit Calendar
            </button>
          </div>
        </section>

        <div class="api-error" *ngIf="apiError" aria-live="polite">
          {{ apiError }}
        </div>
      </section>
    </div>
  </section>
</section>

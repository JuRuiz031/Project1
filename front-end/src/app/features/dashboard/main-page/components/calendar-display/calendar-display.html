<div class="calendar-display-wrapper">
  <div class="card app-card shadow-sm">
    <div class="card-body p-2">
      <section class="calendar-display" aria-label="Calendar Display Area">
        <!-- Top controls -->
        <header class="calendar-display__header">
          <div class="calendar-display__title">
            Calendar Display
          </div>
          
          <!-- Calendar Display Filter Tabs -->
          <div class="calendar-filter-tabs">
            <button
              class="calendar-filter-tab"
              [class.active]="calendarFilter() === 'all'"
              (click)="setCalendarFilter('all')"
            >
              All ({{ totalCount() }})
            </button>
            <button
              class="calendar-filter-tab"
              [class.active]="calendarFilter() === 'events'"
              (click)="setCalendarFilter('events')"
            >
              Events ({{ eventsCount() }})
            </button>
            <button
              class="calendar-filter-tab"
              [class.active]="calendarFilter() === 'polls'"
              (click)="setCalendarFilter('polls')"
            >
              Polls ({{ pollsCount() }})
            </button>
          </div>
        </header>

        <div class="calendar-display__body">
            <app-calendar-widget
              [viewDate]="viewDate"
              [events]="calendarEvents()"
              (viewDateChange)="onViewDateChange($event)"
              (eventClicked)="onEventClicked($event)"
            ></app-calendar-widget>
        </div>

        <!-- Bottom actions -->
        <footer class="calendar-display__footer">
          <button
            type="button"
            class="btn btn-primary-solid"
            (click)="createEvent.emit()"
          >
            Create Event
          </button>

          <button
            type="button"
            class="btn btn-primary-solid"
            (click)="onOpenEventSelector()"
          >
            View Events
          </button>
        </footer>
      </section>
    </div>
  </div>
</div>

<section class="calendar-display" aria-label="Calendar Display Area">
  <!-- Top controls -->
  <header class="calendar-display__header">
    <div class="calendar-display__title">
      {{ currentViewLabel }} View
    </div>
  </header>

  <!-- Main calendar area (placeholder) -->
  <div class="calendar-display__body">
    <div class="calendar-display__placeholder">
      Calendar content will render here
    </div>
  </div>

  <!-- Bottom actions -->
  <footer class="calendar-display__footer">
    <button
      type="button"
      class="calendar-display__action-btn"
      routerLink="/create-event"
    >
      Add Event
    </button>
    <button
      type="button"
      class="calendar-display__action-btn"
      routerLink="/view-event"
    >
      View Event
    </button>
  </footer>
</section>

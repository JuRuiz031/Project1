<section class="calendar-options" aria-label="Calendar Options">
  <h2 class="h6 mb-3"><strong>Calendar Options</strong></h2>

  <div class="d-grid gap-2">
    <button
      type="button"
      class="btn btn-primary"
      (click)="onCreateCalendar()"
    >
      Create New Calendar
    </button>

    <button
      type="button"
      class="btn btn-primary"
      routerLink="/view-calendar-group"
    >
      View Calendars
    </button>
  </div>
</section>

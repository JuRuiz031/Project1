<header class="main-header" role="banner">
  <div class="main-header__inner">
    <div class="main-header__brand">
      {{ siteName }}
    </div>

    <button
      *ngIf="showProfile"
      type="button"
      class="main-header__profile-btn"
      aria-label="Profile (placeholder)"
      routerLink="/account"
    >
      Profile
    </button>
  </div>
</header>

<div class="container py-4 app-page">
  <h1 class="h3 mb-3">Create Poll</h1>

  <div class="card app-card shadow-sm">
    <div class="card-body">
      <form [formGroup]="form" novalidate>
        <div class="row g-3">
          <!-- LEFT COLUMN -->
          <div class="col-12 col-lg-7">
            <!-- Calendar -->
            <div class="mb-3">
              <label class="form-label">Calendar (admin only)</label>
              <select
                class="form-select app-select"
                formControlName="calendarId"
                [ngClass]="{ 'is-invalid': hasError('calendarId') }"
              >
                <option value="" disabled>Select calendar (admin only)</option>
                <option *ngFor="let c of adminCalendars" [value]="c.id">
                  {{ c.name }}
                </option>
              </select>
              <div class="invalid-feedback">Select an admin calendar.</div>
            </div>

            <!-- Title -->
            <div class="mb-3">
              <label class="form-label">Poll Title</label>
              <input
                type="text"
                class="form-control app-input"
                placeholder="Poll title"
                formControlName="title"
                [ngClass]="{ 'is-invalid': hasError('title') }"
              />
              <div class="invalid-feedback">Title required (min 2 chars).</div>
            </div>

            <!-- Start -->
            <div class="row g-3 mb-3">
              <div class="col-12 col-md-6">
                <label class="form-label">Start date</label>
                <input
                  type="date"
                  class="form-control app-input"
                  formControlName="startDate"
                  [ngClass]="{ 'is-invalid': hasError('startDate') }"
                />
                <div class="invalid-feedback">Start date required.</div>
              </div>

              <div class="col-12 col-md-6">
                <label class="form-label">Start time</label>
                <input
                  type="time"
                  class="form-control app-input"
                  formControlName="startTime"
                  [ngClass]="{ 'is-invalid': hasError('startTime') }"
                />
                <div class="invalid-feedback">Start time required.</div>
              </div>
            </div>

            <!-- End -->
            <div class="row g-3 mb-3">
              <div class="col-12 col-md-6">
                <label class="form-label">End date</label>
                <input
                  type="date"
                  class="form-control app-input"
                  formControlName="endDate"
                  [ngClass]="{ 'is-invalid': hasError('endDate') }"
                />
                <div class="invalid-feedback">End date required.</div>
              </div>

              <div class="col-12 col-md-6">
                <label class="form-label">End time</label>
                <input
                  type="time"
                  class="form-control app-input"
                  formControlName="endTime"
                  [ngClass]="{ 'is-invalid': hasError('endTime') }"
                />
                <div class="invalid-feedback">End time required.</div>
              </div>
            </div>

            <!-- OPTIONS -->
            <div class="border rounded p-3">
              <div class="fw-semibold mb-2">Options</div>

              <div class="d-grid gap-2">
                <div
                  class="input-group"
                  *ngFor="let optCtrl of options.controls; let i = index"
                >
                  <input class="form-control app-input" [formControl]="optCtrl" />
                  <button
                    class="btn btn-outline-secondary"
                    type="button"
                    (click)="removeOption(i)"
                    aria-label="Remove option"
                    title="Remove"
                  >
                    ✕
                  </button>
                </div>

                <div class="text-secondary" *ngIf="options.length === 0">
                  Options list
                </div>
              </div>

              <div class="input-group mt-3">
                <input
                  class="form-control app-input"
                  type="text"
                  placeholder="Option text"
                  [(ngModel)]="optionInput"
                  [ngModelOptions]="{ standalone: true }"
                />
                <button class="btn btn-outline-secondary" type="button" (click)="addOption()">
                  Add Option
                </button>
              </div>
            </div>
          </div>

          <!-- RIGHT COLUMN -->
          <div class="col-12 col-lg-5">
            <div class="border rounded p-3">
              <div class="fw-semibold mb-2">Tags</div>

              <div class="d-flex flex-wrap gap-2">
                <span
                  class="badge rounded-pill text-bg-secondary d-inline-flex align-items-center gap-2"
                  *ngFor="let tagCtrl of tags.controls; let i = index"
                >
                  <span>{{ tagCtrl.value }}</span>
                  <button
                    type="button"
                    class="btn btn-sm btn-link p-0 text-decoration-none"
                    (click)="removeTag(i)"
                    aria-label="Remove tag"
                    title="Remove"
                  >
                    ✕
                  </button>
                </span>

                <div class="text-secondary" *ngIf="tags.length === 0">Tags list</div>
              </div>

              <div class="input-group mt-3">
                <input
                  class="form-control app-input"
                  type="text"
                  placeholder="Tag text"
                  [(ngModel)]="tagInput"
                  [ngModelOptions]="{ standalone: true }"
                />
                <button class="btn btn-outline-secondary" type="button" (click)="addTag()">
                  Add Tag
                </button>
              </div>
            </div>

            <!-- API error -->
            <div *ngIf="apiError" class="alert alert-danger mt-3 mb-0">
              {{ apiError }}
            </div>
          </div>
        </div>
      </form>
    </div>

    <!-- Footer actions (Create Event / Create Calendar style) -->
    <div class="card-footer d-flex justify-content-end gap-2">
      <button class="btn btn-outline-secondary" type="button" (click)="cancel()">
        Cancel
      </button>

      <button
        class="btn btn-primary"
        type="button"
        (click)="submit()"
        [disabled]="isSubmitting"
      >
        {{ isSubmitting ? 'Creating...' : 'Create Poll' }}
      </button>
    </div>
  </div>
</div>

<app-base-modal
  [title]="title()"
  [showBackButton]="false"
  [size]="'large'"
  (close)="onClose()"
>
  <!-- API error -->
  <div *ngIf="apiError()" class="alert alert-danger mb-3">
    {{ apiError() }}
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="row g-3">

      <!-- LEFT COLUMN -->
      <div class="col-12 col-lg-7">
        <!-- Calendar -->
        <div class="mb-3">
          <label class="form-label">Calendar (admin only)</label>
          <select
            class="form-select app-select"
            formControlName="calendarId"
            [ngClass]="{ 'is-invalid': hasError('calendarId') }"
          >
            <option value="" disabled>Select calendar (admin only)</option>
            <option *ngFor="let c of adminCalendars()" [value]="c.id">
              {{ c.name }}
            </option>
          </select>
          <div class="invalid-feedback">Select an admin calendar.</div>
        </div>

        <!-- Title -->
        <div class="mb-3">
          <label class="form-label">Poll Title</label>
          <input
            type="text"
            class="form-control app-input"
            placeholder="Poll title"
            formControlName="title"
            [ngClass]="{ 'is-invalid': hasError('title') }"
          />
          <div class="invalid-feedback">Title required (min 2 chars).</div>
        </div>

        <!-- Description -->
        <div class="mb-3">
          <label class="form-label">Description (optional)</label>
          <textarea
            class="form-control app-input"
            rows="3"
            placeholder="Optional description for this poll"
            formControlName="description"
            [ngClass]="{ 'is-invalid': hasError('description') }"
          ></textarea>

          <div class="invalid-feedback">
            Description is too long.
          </div>
        </div>


        <!-- Start -->
        <div class="row g-3 mb-3">
          <div class="col-12 col-md-6">
            <label class="form-label">Start date</label>
            <input
              type="date"
              class="form-control app-input"
              formControlName="startDate"
              [ngClass]="{ 'is-invalid': hasError('startDate') }"
            />
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">Start time</label>
            <input
              type="time"
              class="form-control app-input"
              formControlName="startTime"
              [ngClass]="{ 'is-invalid': hasError('startTime') }"
            />
          </div>
        </div>

        <!-- End -->
        <div class="row g-3 mb-3">
          <div class="col-12 col-md-6">
            <label class="form-label">End date</label>
            <input
              type="date"
              class="form-control app-input"
              formControlName="endDate"
              [ngClass]="{ 'is-invalid': hasError('endDate') }"
            />
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label">End time</label>
            <input
              type="time"
              class="form-control app-input"
              formControlName="endTime"
              [ngClass]="{ 'is-invalid': hasError('endTime') }"
            />
          </div>
        </div>

        <!-- Voting settings -->
        <div class="border rounded p-3 mb-3">
          <div class="fw-semibold mb-2">Voting</div>

          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              id="allowMultipleVotes"
              formControlName="allow_multiple_votes"
            />
            <label class="form-check-label" for="allowMultipleVotes">
              Allow multiple votes (choose more than one option)
            </label>
          </div>

          <div class="form-text text-secondary">
            If unchecked, users can vote for only one option.
          </div>
        </div>


        <!-- OPTIONS -->
        <div class="border rounded p-3">
          <div class="fw-semibold mb-2">Options</div>

          <div class="d-grid gap-2">
            <div
              class="input-group"
              *ngFor="let optCtrl of options.controls; let i = index"
            >
              <input class="form-control app-input" [formControl]="optCtrl" />
              <button
                class="btn btn-outline-secondary"
                type="button"
                (click)="removeOption(i)"
              >
                ✕
              </button>
            </div>
          </div>

          <div class="input-group mt-3">
            <input
              class="form-control app-input"
              type="text"
              placeholder="Option text"
              [(ngModel)]="optionInput"
              [ngModelOptions]="{ standalone: true }"
            />
            <button class="btn btn-outline-secondary" type="button" (click)="addOption()">
              Add Option
            </button>
          </div>
        </div>
      </div>

      <!-- RIGHT COLUMN -->
      <div class="col-12 col-lg-5">
        <div class="border rounded p-3">
          <div class="fw-semibold mb-2">Tags</div>

          <div class="d-flex flex-wrap gap-2">
            <span
              class="badge rounded-pill text-bg-secondary d-inline-flex align-items-center gap-2"
              *ngFor="let tagCtrl of tags.controls; let i = index"
            >
              {{ tagCtrl.value }}
              <button
                type="button"
                class="btn btn-sm btn-link p-0"
                (click)="removeTag(i)"
              >
                ✕
              </button>
            </span>
          </div>

          <div class="input-group mt-3">
            <input
              class="form-control app-input"
              type="text"
              placeholder="Tag text"
              [(ngModel)]="tagInput"
              [ngModelOptions]="{ standalone: true }"
            />
            <button class="btn btn-outline-secondary" type="button" (click)="addTag()">
              Add Tag
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL FOOTER -->
    <div class="d-flex justify-content-end gap-2 mt-4">
      <button type="button" class="btn btn-outline-secondary" (click)="onClose()" [disabled]="isSubmitting()">
        Cancel
      </button>

      <button type="submit" class="btn btn-primary" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Creating…' : 'Create Poll' }}
      </button>
    </div>
  </form>
</app-base-modal>

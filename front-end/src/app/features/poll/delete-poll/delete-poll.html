<div class="container py-4 app-page">
  <h1 class="h3 mb-3">Delete Poll</h1>

  <div class="card app-card shadow-sm">
    <div class="card-body">
      <div class="delete-poll__message">
        Are you sure you want to delete
        <strong>"{{ pollName }}"</strong>?
      </div>

      <div *ngIf="apiError" class="alert alert-danger mt-3 mb-0">
        {{ apiError }}
      </div>
    </div>

    <div class="card-footer d-flex justify-content-center gap-5">
      <button
        type="button"
        class="btn btn-danger"
        (click)="confirmDelete()"
        [disabled]="isDeleting"
      >
        {{ isDeleting ? 'Deleting...' : 'Confirm' }}
      </button>

      <a class="btn btn-outline-light" routerLink="/view-poll">
        Cancel
      </a>
    </div>
  </div>
</div>

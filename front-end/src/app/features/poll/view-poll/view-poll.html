<div class="container py-4 app-page">
  <h1 class="h3 mb-3">View Poll</h1>

  <div class="card app-card shadow-sm">
    <div class="card-body">
      <div class="row g-3">
        <!-- LEFT COLUMN -->
        <div class="col-12 col-lg-7">
          <!-- Calendar -->
          <div class="mb-3">
            <label class="form-label">Calendar</label>
            <input
              class="form-control app-input"
              [value]="poll.calendarName"
              disabled
            />
          </div>

          <!-- Title -->
          <div class="mb-3">
            <label class="form-label">Poll Title</label>
            <input
              type="text"
              class="form-control app-input"
              [value]="poll.title"
              disabled
            />
          </div>

          <!-- Start (same structure as Create Poll: date + time) -->
          <div class="row g-3 mb-3">
            <div class="col-12 col-md-6">
              <label class="form-label">Start date</label>
              <input
                type="text"
                class="form-control app-input"
                [value]="poll.startDate"
                disabled
              />
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label">Start time</label>
              <input
                type="text"
                class="form-control app-input"
                [value]="poll.startTime"
                disabled
              />
            </div>
          </div>

          <!-- End (same structure as Create Poll: date + time) -->
          <div class="row g-3 mb-3">
            <div class="col-12 col-md-6">
              <label class="form-label">End date</label>
              <input
                type="text"
                class="form-control app-input"
                [value]="poll.endDate"
                disabled
              />
            </div>

            <div class="col-12 col-md-6">
              <label class="form-label">End time</label>
              <input
                type="text"
                class="form-control app-input"
                [value]="poll.endTime"
                disabled
              />
            </div>
          </div>

          <!-- OPTIONS (Create Poll structure, but read-only and no "add" row) -->
          <div class="border border-secondary rounded p-3">
            <div class="fw-semibold mb-2">Options</div>

            <div class="d-grid gap-2">
              <div class="input-group" *ngFor="let opt of poll.options">
                <input
                  class="form-control app-input"
                  [value]="opt"
                  disabled
                />
              </div>

              <div class="text-secondary" *ngIf="poll.options.length === 0">
                Options list
              </div>
            </div>
          </div>
        </div>

        <!-- RIGHT COLUMN -->
        <div class="col-12 col-lg-5">
          <div class="border border-secondary rounded p-3">
            <div class="fw-semibold mb-2">Tags</div>

            <div class="d-flex flex-wrap gap-2">
              <span
                class="badge rounded-pill text-bg-secondary d-inline-flex align-items-center gap-2"
                *ngFor="let tag of poll.tags"
              >
                <span>{{ tag }}</span>
              </span>

              <div class="text-secondary" *ngIf="poll.tags.length === 0">
                Tags list
              </div>
            </div>

            <!-- Removed: tag input + Add Tag button -->
          </div>

          <!-- Optional: keep if your TS sets apiError on view page -->
          <div *ngIf="apiError" class="alert alert-danger mt-3 mb-0">
            {{ apiError }}
          </div>
        </div>
      </div>
    </div>

    <!-- Footer actions -->
    <div class="card-footer d-flex justify-content-end gap-2">
      <button
        class="btn btn-outline-secondary"
        type="button"
        (click)="goToDashboard()"
      >
        Back
      </button>

      <button
        class="btn btn-primary"
        type="button"
        (click)="goToEdit()"
      >
        Edit Poll
      </button>
    </div>
  </div>
</div>

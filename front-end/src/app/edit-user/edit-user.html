<h1 class="page-header">Edit User</h1>

<div class ="page-border" [formGroup]="form">

  <label class="field">
    <div class="field-label">Username</div>
    <input class="field-input" type="text" formControlName="username" />
    <div class="field-error" *ngIf="form.get('username')?.touched && form.get('username')?.invalid">
      Username is required (min 3)
    </div>
  </label>

    <label class="field">
    <div class="field-label">Email</div>
    <input class="field-input" type="email" formControlName="email" />
    <div class="field-error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
      Valid email is required
    </div>
  </label>

  <label class="field">
    <div class="field-label">Password</div>
    <input class="field-input" type="password" formControlName="password" />
    <div class="field-error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
      Password is required (min 8)
    </div>
  </label>

</div>

<div class="container">
  <button class="save-user-button" (click)="save()" [disabled]="form.invalid || isSaving">
    {{ isSaving ? 'Saving...' : 'Save Changes' }}
  </button>

  <button class="delete-user-profile-button" routerLink="/login">
    Delete User Profile
  </button>
</div>

<div class="api-error" *ngIf="apiError">
  {{ apiError }}
</div>
